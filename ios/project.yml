# XcodeGen-Projektdefinition  →  `brew install xcodegen && xcodegen generate`
name: Rollladen
options:
  bundleIdPrefix: de.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # eigenes Team-ID eintragen
targets:
  Rollladen:
    type: application
    platform: iOS
    sources: [Sources]
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.example.rollladen
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Rollläden
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Die App steuert deine Shelly-Rollladenaktoren im lokalen WLAN.
        NSLocationWhenInUseUsageDescription: Der Standort wird nur einmalig verwendet, um Sonnenauf- und -untergang zu berechnen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
